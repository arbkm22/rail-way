<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Railways Route Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚂 Indian Railways Route Finder</h1>
            <p class="subtitle">Find the best train routes between any two stations</p>
        </header>

        {% if error %}
        <div class="error-message">
            <strong>Error:</strong> {{ error }}
            <p>Please run: <code>python3 generate_sample_timetables.py</code></p>
        </div>
        {% else %}
        <main>
            <div class="search-form">
                <div class="form-group">
                    <label for="from_station">From Station:</label>
                    <select id="from_station" name="from_station" required>
                        <option value="">Select starting station</option>
                        {% for station in stations %}
                        <option value="{{ station }}">{{ station }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="to_station">To Station:</label>
                    <select id="to_station" name="to_station" required>
                        <option value="">Select destination station</option>
                        {% for station in stations %}
                        <option value="{{ station }}">{{ station }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="advanced-options">
                    <h3>Advanced Options</h3>
                    <div class="options-grid">
                        <div class="form-group">
                            <label for="max_waiting_hours">Max Waiting Time (hours):</label>
                            <input type="number" id="max_waiting_hours" name="max_waiting_hours" value="4" min="1" max="12">
                        </div>

                        <div class="form-group">
                            <label for="max_hops">Max Train Changes:</label>
                            <input type="number" id="max_hops" name="max_hops" value="3" min="1" max="5">
                        </div>
                    </div>
                </div>

                <button id="search-btn" class="search-button">Find Routes</button>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Searching for routes...</p>
            </div>

            <div id="results" class="results"></div>
        </main>
        {% endif %}

        <footer>
            <p>Data sourced from ProKerala | Built with Python & Flask</p>
        </footer>
    </div>

    <script>
        document.getElementById('search-btn').addEventListener('click', async function() {
            const fromStation = document.getElementById('from_station').value;
            const toStation = document.getElementById('to_station').value;
            const maxWaitingHours = document.getElementById('max_waiting_hours').value;
            const maxHops = document.getElementById('max_hops').value;

            if (!fromStation || !toStation) {
                alert('Please select both stations');
                return;
            }

            if (fromStation === toStation) {
                alert('Source and destination cannot be the same');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch('/find_routes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        from_station: fromStation,
                        to_station: toStation,
                        max_waiting_hours: maxWaitingHours,
                        max_hops: maxHops
                    })
                });

                const data = await response.json();

                // Hide loading
                document.getElementById('loading').style.display = 'none';

                if (data.error) {
                    document.getElementById('results').innerHTML = `
                        <div class="error-message">
                            <strong>Error:</strong> ${data.error}
                        </div>
                    `;
                    return;
                }

                if (data.routes.length === 0) {
                    document.getElementById('results').innerHTML = `
                        <div class="no-results">
                            <h2>No Routes Found</h2>
                            <p>${data.message}</p>
                        </div>
                    `;
                    return;
                }

                // Display results
                let html = `
                    <div class="results-header">
                        <h2>Routes from ${data.from_station} to ${data.to_station}</h2>
                        <p>Found ${data.routes.length} route(s)</p>
                    </div>
                `;

                data.routes.forEach((route, index) => {
                    html += `
                        <div class="route-card">
                            <div class="route-header">
                                <h3>Option ${index + 1}</h3>
                                <div class="route-info">
                                    <span class="badge ${route.route_type === 'DIRECT' ? 'badge-success' : 'badge-warning'}">
                                        ${route.route_type}
                                    </span>
                                    <span class="duration">⏱️ ${route.total_duration}</span>
                                    <span class="changes">🔄 ${route.num_changes} change(s)</span>
                                </div>
                            </div>
                            <div class="route-segments">
                    `;

                    route.segments.forEach((segment, segIndex) => {
                        html += `
                            <div class="segment">
                                <div class="segment-header">
                                    <strong>Segment ${segIndex + 1}:</strong> ${segment.train_name} (${segment.train_no})
                                </div>
                                <div class="segment-details">
                                    <div class="station-time">
                                        <div class="station">${segment.from_station}</div>
                                        <div class="time">Departure: ${segment.departure}</div>
                                    </div>
                                    <div class="journey-line">
                                        <div class="duration-badge">${segment.duration}</div>
                                    </div>
                                    <div class="station-time">
                                        <div class="station">${segment.to_station}</div>
                                        <div class="time">Arrival: ${segment.arrival}</div>
                                    </div>
                                </div>
                            </div>
                        `;

                        if (segment.waiting_time) {
                            html += `
                                <div class="waiting-time">
                                    ⏳ Waiting time at ${segment.to_station}: ${segment.waiting_time}
                                </div>
                            `;
                        }
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });

                document.getElementById('results').innerHTML = html;

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
